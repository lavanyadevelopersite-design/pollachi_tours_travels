openapi: 3.0.0
info:
  title: Tours & Travels CRM API
  version: 1.0.0
  description: |
    Production-ready Tours & Travels CRM backend.
    Auth uses JWT access + refresh tokens with rotation.
paths:
  /api/health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        '200':
          description: OK
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                rememberMe:
                  type: boolean
      responses:
        '200':
          description: Login successful
  /api/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token
      responses:
        '200':
          description: Tokens rotated
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: Profile
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Roles
  - name: Masters
  - name: Leads
  - name: Bookings
  - name: Finance
  - name: Reports
